name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=low
      - run: mkdir -p artifacts && npm sbom --sbom-format cyclonedx --omit=dev > artifacts/sbom.cyclonedx.json
      - uses: actions/upload-artifact@v7
        with:
          name: production-sbom
          path: artifacts/sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30
